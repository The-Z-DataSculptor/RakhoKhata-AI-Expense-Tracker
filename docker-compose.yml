services:
  expense-backend-app:
    build: ./backend
    container_name: expense-backend-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://placeholder:placeholder@localhost:5432/placeholder}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_key_must_be_long_and_secure_12345}
      - PASETO_SECRET=${PASETO_SECRET:-dev_paseto_secret_key_must_be_32_characters_long_for_security}
      - CLIENT_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - TRUST_PROXY=1
    networks:
      - app-network

  expense-frontend-app:
    build: ./frontend
    container_name: expense-frontend-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://expense-backend-app:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    networks:
      - app-network
    depends_on:
      - expense-backend-app

networks:
  app-network:
    driver: bridge
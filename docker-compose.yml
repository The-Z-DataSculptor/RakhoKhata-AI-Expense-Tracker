# docker-compose.yml

# ==========================================================================
# === SECTION 1: NETWORKS & VOLUMES ===
# ==========================================================================
# Custom bridge network enforces isolated container-to-container 
# DNS name resolution (e.g. frontend calling http://backend:5000).
networks:
  expense_tracker_network:
    driver: bridge

# Managed Docker named volume to persist user uploaded media assets safely.
volumes:
  backend_uploads_data:
    driver: local
# === SECTION 1 END ===

# ==========================================================================
# === SECTION 2: BACKEND SERVICE DEFINITION ===
# ==========================================================================
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: unless-stopped
    networks:
      - expense_tracker_network
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - backend_uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
# === SECTION 2 END ===

# ==========================================================================
# === SECTION 3: FRONTEND SERVICE DEFINITION ===
# ==========================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Passes public API base URL at Next.js build time for client bundle
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: expense_tracker_frontend
    restart: unless-stopped
    networks:
      - expense_tracker_network
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Client-side (Browser) API calls target localhost:5000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      # Server-Side Rendering (SSR / Server Components) targets container DNS
      - INTERNAL_API_URL=http://backend:5000
      - API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
# === SECTION 3 END ===
# docker-compose.yml

# ==========================================================================
# === SECTION 1: NETWORKS & VOLUMES ===
# ==========================================================================
networks:
  expense_tracker_network:
    driver: bridge

volumes:
  backend_uploads_data:
    driver: local
# === SECTION 1 END ===

# ==========================================================================
# === SECTION 2: BACKEND SERVICE DEFINITION ===
# ==========================================================================
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: unless-stopped
    networks:
      - expense_tracker_network
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - backend_uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
# === SECTION 2 END ===

# ==========================================================================
# === SECTION 3: FRONTEND SERVICE DEFINITION ===
# ==========================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://expense-backend-jcy1.onrender.com}
    container_name: expense_tracker_frontend
    restart: unless-stopped
    networks:
      - expense_tracker_network
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://expense-backend-jcy1.onrender.com}
      - INTERNAL_API_URL=http://backend:5000
      - API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
# === SECTION 3 END ===
services:
  # ---------------------------------------------------------------------------
  # BACKEND SERVICE (Node.js + Express + Prisma)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Preserve user file uploads across container restarts
      - ./Backend/public/uploads:/app/public/uploads
    restart: always

  # ---------------------------------------------------------------------------
  # FRONTEND SERVICE (Next.js Standalone)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: expense_tracker_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - INTERNAL_API_URL=http://backend:5000
      - API_URL=http://backend:5000
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    restart: always